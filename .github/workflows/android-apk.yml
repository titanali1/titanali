name: Build XsayaTrade Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'exchange.css'
      - 'extra.css'
      - 'backend-ui.css'
      - 'i18n.css'
      - 'i18n.js'
      - 'app.js'
      - 'sw.js'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'xsayatrade-logo.png'
      - 'xsayatrade-logo-*.png'
      - '.github/workflows/android-apk.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        id: build-apk
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Report Gradle failure details
        if: failure() && steps.build-apk.outcome == 'failure'
        run: |
          details="$(tail -n 24 "$RUNNER_TEMP/android-build.log")"
          details=${details//'%'/'%25'}
          details=${details//$'\r'/'%0D'}
          details=${details//$'\n'/'%0A'}
          echo "::error title=Gradle failure details::$details"
      - name: Verify launcher Activity is compiled into the APK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'ai.xsayatrade.app.MainActivity'
      - uses: actions/upload-artifact@v4
        with:
          name: xsayatrade-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
