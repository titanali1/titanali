name: Build Vexon Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'exchange.css'
      - 'extra.css'
      - 'backend-ui.css'
      - 'i18n.css'
      - 'i18n.js'
      - 'app.js'
      - 'sw.js'
      - 'icon.svg'
      - '.github/workflows/android-apk.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vexon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  startup-smoke-test:
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35]
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: vexon-debug-apk
          path: apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          working-directory: ${{ github.workspace }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set +e
            LOG="$GITHUB_WORKSPACE/android-startup-logcat.txt"
            LAUNCH="$GITHUB_WORKSPACE/android-launch.txt"
            {
              echo "workspace=$GITHUB_WORKSPACE"
              echo "api=${{ matrix.api-level }}"
              pwd
              ls -l "$GITHUB_WORKSPACE/apk/app-debug.apk"
              adb devices -l
              adb logcat -c
              adb install -r "$GITHUB_WORKSPACE/apk/app-debug.apk"
              INSTALL_STATUS=$?
              echo "install_status=$INSTALL_STATUS"
              adb shell am start -W -n ai.vexon.app.debug/ai.vexon.app.MainActivity > "$LAUNCH" 2>&1
              START_STATUS=$?
              echo "start_status=$START_STATUS"
              cat "$LAUNCH"
              sleep 8
              APP_PID="$(adb shell pidof ai.vexon.app.debug 2>/dev/null | tr -d '\r')"
              echo "app_pid=$APP_PID"
              adb logcat -d -v threadtime -t 3000
            } > "$LOG" 2>&1
            cat "$LOG"
            APP_PID="$(grep '^app_pid=' "$LOG" | tail -1 | cut -d= -f2-)"
            if [ -z "$APP_PID" ]; then
              FAILURE="$(grep -E -m1 'FATAL EXCEPTION|Caused by:|Fatal signal|INSTALL_FAILED|Error:' "$LOG" | tr -d '\r' || true)"
              echo "::error title=Android startup diagnostic::${FAILURE:-Check the uploaded Android startup log for the failure details.}"
              { echo '### Android startup log'; echo '```text'; tail -n 150 "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Vexon stayed alive after launch (PID $APP_PID) on API ${{ matrix.api-level }}."
      - name: Save crash log if startup failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-log-api-${{ matrix.api-level }}
          path: ${{ github.workspace }}/android-startup-logcat.txt
          if-no-files-found: ignore
