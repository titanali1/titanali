name: Build Vexon Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'exchange.css'
      - 'extra.css'
      - 'backend-ui.css'
      - 'i18n.css'
      - 'i18n.js'
      - 'app.js'
      - 'sw.js'
      - 'icon.svg'
      - '.github/workflows/android-apk.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vexon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  startup-smoke-test:
    needs: debug-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35]
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: vexon-debug-apk
          path: apk
      - name: Install and launch on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -W -n ai.vexon.app.debug/ai.vexon.app.MainActivity
            sleep 8
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'ai.vexon.app.debug'
            if adb logcat -d -t 1500 | grep -A8 'FATAL EXCEPTION' | grep -q 'ai.vexon.app.debug'; then
              adb logcat -d -t 1500
              exit 1
            fi
