name: Vexon backend checks

on:
  push:
    paths:
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - '.github/workflows/backend-check.yml'
  pull_request:
    paths:
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - '.github/workflows/backend-check.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
